name: Deploy documentation to Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/pages/**"
      - ".github/workflows/pages.yml"
      - "docs/v1/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.4.1

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build v1 documentation
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/v1/
        run: pnpm docs:build
      - name: Stage Pages artifact
        run: |
          mkdir -p _site/v1
          cp -R docs/v1/.vitepress/dist/. _site/v1/
          cp .github/pages/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
